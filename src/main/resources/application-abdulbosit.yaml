spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/<your database in postgres>
    username: <your database username>
    password: <your database password>

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: <your email google>
    password: <your password google>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

olx:
  app:
    base-folder: <your package in local pc>

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql: TRACE
    com.example.your.app: DEBUG
recaptcha:
  site-key: YOUR_SITE_KEY
  secret-key: YOUR_SECRET_KEY
